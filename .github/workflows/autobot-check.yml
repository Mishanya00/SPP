name: Autobot code checks
on:
  push:
    paths: ['Autobot/**', '.github/workflows/autobot-check.yml']
  pull_request:
    paths: ['Autobot/**', '.github/workflows/autobot-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Autobot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: Autobot/package-lock.json
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run check
