name: autobot
services:
  runner-image:
    image: autobot-runner:local
    build: ./runner
    command: ["python", "-c", "print('Runner image ready')"]
    restart: "no"
  app:
    image: autobot-app:recovered
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      runner-image:
        condition: service_completed_successfully
    restart: unless-stopped
